name = "Terraria"
author = "Darkkal44"
background = "image"

[[font]]
file = "Andy Bold.ttf"
family = "Andy Bold"
license = "Commercial (Monotype)"
url = "https://www.myfonts.com/collections/andy-font-matteson-typographics/"

[[option]]
key = "background_mode"
label = "Background"
type = "enum"
choices = [
  { value = "time", label = "Follow the time of day" },
  { value = "random", label = "Random" },
  { value = "static", label = "Fixed" },
]

[[option]]
key = "background_index"
label = "Fixed background"
type = "enum"
choices = [
  { value = "1", label = "Forest lake" },
  { value = "2", label = "Sky islands" },
  { value = "3", label = "Crimson" },
  { value = "4", label = "Corruption" },
  { value = "5", label = "Snow" },
]
enabled_when = { background_mode = "static" }
