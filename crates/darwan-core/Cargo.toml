[package]
name = "darwan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
material-colors = { version = "0.4.2", features = ["image"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
zbus = "5.19.0"
rustix = { version = "1.1.5", features = ["process"] }
md-5 = "0.10"
png = "0.18.1"
